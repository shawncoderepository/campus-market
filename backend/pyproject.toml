[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-market"
version = "0.1.0"
description = "校园二手交易与智能议价助手 - 后端"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiomysql>=0.2.0,<1.0.0",
  "aiosqlite>=0.20.0,<1.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "pydantic>=2.7.0,<3.0.0",
  "pyyaml>=6.0.0,<7.0.0",
  "redis>=5.0.0,<9.0.0",
  "tortoise-orm>=0.22.0,<0.26.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "python-jose[cryptography]>=3.3.0,<4.0.0",
  "bcrypt>=4.0.0,<6.0.0",
  "python-multipart>=0.0.9,<1.0.0",
  "httpx>=0.27.0,<1.0.0",
  "email-validator>=2.0.0,<3.0.0",
  "aerich>=0.8.0,<1.0.0",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0,<1.0.0",
  "pytest>=8.0.0,<9.0.0",
  "pytest-asyncio>=0.23.0,<1.0.0",
  "ruff>=0.6.0,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["application*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 路由函数使用 Depends()/File() 作为参数默认值是框架惯例，B008 为误报
"application/apis/**" = ["B008"]
"application/common/dependency.py" = ["B008"]
